<div
  class="border border-slate-100 rounded-xl p-4 bg-white flex flex-col justify-between hover:border-emerald-200 transition-colors h-full shadow-sm">
  <div>
    <h4 class="font-semibold text-sm text-slate-800 mb-1">{{ exercise.title }}</h4>
    <p class="text-xs text-slate-500 line-clamp-3 mb-4">{{ exercise.description }}</p>
  </div>

  <div class="space-y-3">
    <div class="flex gap-2 text-[11px] text-slate-400">
      <span class="bg-slate-50 px-2 py-0.5 rounded border border-slate-100">⏱ {{ exercise.durationMinutes }} min</span>
      <span class="bg-slate-50 px-2 py-0.5 rounded border border-slate-100">★ {{ exercise.difficultyLevel }}</span>
    </div>

    <button
      class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-medium transition-colors shadow-sm">
      {{ exercise.type === 'Meditation' ? 'Listen to Session' : 'Start Exercise' }}
    </button>
  </div>
</div>
