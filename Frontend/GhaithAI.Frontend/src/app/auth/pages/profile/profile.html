<div class="profile-page">

  <div class="profile-card">

    <div class="header">

      <div class="avatar">

        H

      </div>

      <h2>
        My Profile
      </h2>

      <p>
        Manage your account
      </p>

    </div>

    <form
      [formGroup]="profileForm"
      (ngSubmit)="updateProfile()">

      <div class="form-group">

        <label>
          Full Name
        </label>

        <input
          type="text"
          formControlName="fullName">

      </div>

      <div class="form-group">

        <label>
          Language
        </label>

        <select
          formControlName="preferredLanguage">

          <option value="en">
            English
          </option>

          <option value="ar">
            Arabic
          </option>

        </select>

      </div>

      <div class="memory-box">

        <input
          type="checkbox"
          formControlName="memoryEnabled">

        <span>
          Enable Memory
        </span>

      </div>

      <button
        class="save-btn"
        type="submit">

        Save Changes

      </button>

    </form>

    <button
      class="logout-btn"
      (click)="logout()">

      Logout

    </button>

  </div>

</div>
