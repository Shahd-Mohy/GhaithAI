<div class="mock-page">

  <div class="mock-card">

    <!-- Header -->
    <div class="mock-header">
      <div class="stripe-logo">
        <svg viewBox="0 0 60 25" fill="white">
          <path d="M5 10.2c0-.7.6-1 1.5-1 1.4 0 3.1.4 4.5 1.2V6.8C9.6 6.2 8.1 6 6.5 6 2.9 6 .5 7.9.5 10.4c0 4 5.5 3.4 5.5 5.1 0 .8-.7 1.1-1.7 1.1-1.5 0-3.4-.6-4.9-1.5v3.7c1.7.7 3.3 1 4.9 1 3.7 0 6.2-1.8 6.2-4.4C10.5 11.2 5 11.9 5 10.2z"/>
        </svg>
        <span>Test Payment</span>
      </div>
      <div class="test-badge">TEST MODE</div>
    </div>

    <!-- Amount -->
    <div class="amount-section">
      <p class="amount-label">Amount due</p>
      <p class="amount-value">${{ amount }} USD</p>
      <p class="amount-desc">GhaithAI Therapy Session</p>
    </div>

    <!-- Success State -->
    <div class="success-state" *ngIf="confirmed">
      <svg fill="none" stroke="#059669" stroke-width="2" viewBox="0 0 24 24">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <p>Payment confirmed! Redirecting...</p>
    </div>

    <!-- Form -->
    <ng-container *ngIf="!confirmed">

      <!-- Fake Card Fields -->
      <div class="card-fields">
        <div class="field-group">
          <label>Card number</label>
          <div class="fake-input">
            <span>4242 4242 4242 4242</span>
            <svg viewBox="0 0 24 24" fill="#1A1F71">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <path d="M2 10h20" stroke="white" stroke-width="2"/>
            </svg>
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label>Expiry</label>
            <div class="fake-input"><span>12 / 28</span></div>
          </div>
          <div class="field-group">
            <label>CVC</label>
            <div class="fake-input"><span>123</span></div>
          </div>
        </div>

        <div class="field-group">
          <label>Name on card</label>
          <div class="fake-input"><span>Test User</span></div>
        </div>
      </div>

      <div class="test-note">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        This is a test environment. No real payment will be made.
      </div>

      <div class="error-msg" *ngIf="error">{{ error }}</div>

      <button class="btn-pay" [disabled]="loading" (click)="confirmPayment()">
        <svg *ngIf="loading" fill="none" stroke="white" stroke-width="2"
             viewBox="0 0 24 24" style="animation:spin 1s linear infinite">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
        {{ loading ? 'Processing...' : 'Pay $' + amount }}
      </button>

      <button class="btn-cancel" (click)="cancelPayment()">Cancel</button>

    </ng-container>

  </div>

</div>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
