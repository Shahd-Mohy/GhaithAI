<div class="journal-container">
  <!-- HEADER -->
  <div class="journal-header">
    <div>
      <h2 class="journal-title">Journal</h2>
      <p class="journal-sub">Your private space to reflect and express</p>
    </div>
    <button class="new-entry-btn" *ngIf="!isCreatingEntry" (click)="toggleNewEntry()">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
      </svg>
      New Entry
    </button>
  </div>

  <ng-container *ngIf="!isCreatingEntry">
    <!-- TOP STATS / SEARCH -->
    <div class="top-bar-cards">
      <div class="card search-card">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-input" placeholder="Search your entries..." [(ngModel)]="searchQuery" />
        </div>
      </div>
      
      <div class="card stats-card">
        <div class="stats-info">
          <span class="stats-number">{{ totalEntries }}</span>
          <span class="stats-label">Total Entries</span>
        </div>
        <div class="stats-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0B8FAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
            <path d="M9.5 8.5c0 1.5 2 3.5 2 3.5s2-2 2-3.5a1.5 1.5 0 0 0-3-1.5c-1 0-1 1.5-1 1.5z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- ENTRIES LIST -->
    <div class="entries-list">
      <div *ngFor="let entry of entries" class="card entry-card">
        <div class="entry-header">
          <div class="entry-date-row">
            <span class="entry-mood-emoji">{{ entry.moodEmoji }}</span>
            <svg class="calendar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span class="entry-date">{{ entry.dateStr }}</span>
          </div>
        </div>
        <h3 class="entry-title">{{ entry.title }}</h3>
        <p class="entry-body">{{ entry.body }}</p>
        <div class="entry-tags">
          <span *ngFor="let tag of entry.tags" class="tag">#{{ tag }}</span>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="isCreatingEntry">
    <div class="card new-entry-card">
      <div class="new-entry-header">
        <div>
          <h3 class="new-entry-title">New Journal Entry</h3>
          <p class="new-entry-date">{{ todayLabel }}</p>
        </div>
        <div class="private-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Private & Encrypted
        </div>
      </div>

      <div class="form-group">
        <label>How are you feeling?</label>
        <div class="mood-pills">
          <button *ngFor="let m of moods" type="button" class="mood-pill"
                  [class.active]="newEntryMood === m.label"
                  (click)="selectMood(m.label)">
            <span class="emoji">{{ m.icon }}</span> {{ m.label }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Title (optional)</label>
        <input type="text" class="form-input" placeholder="Give your entry a title..." [(ngModel)]="newEntryTitle" />
      </div>

      <div class="form-group">
        <label>What's on your mind?</label>
        <textarea class="form-textarea" placeholder="Start writing..." [(ngModel)]="newEntryBody"></textarea>
      </div>

      <div class="form-group">
        <label>Need inspiration? Try a prompt:</label>
        <div class="prompt-pills">
          <button *ngFor="let p of prompts" type="button" class="prompt-pill" (click)="applyPrompt(p)">
            {{ p }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Tags</label>
        <div class="tag-input-row">
          <input type="text" class="tag-input form-input" placeholder="Add a tag..." 
                 [(ngModel)]="currentTagInput" (keyup.enter)="addTag()" />
          <button type="button" class="add-tag-btn" (click)="addTag()">Add</button>
        </div>
        <div class="selected-tags" *ngIf="newEntryTags.length > 0">
          <span *ngFor="let tag of newEntryTags; let i = index" class="tag selected-tag">
            {{ tag }}
            <button type="button" class="remove-tag" (click)="removeTag(i)">×</button>
          </span>
        </div>
      </div>

      <div class="new-entry-actions">
        <button type="button" class="cancel-btn" (click)="toggleNewEntry()">Cancel</button>
        <button type="button" class="save-entry-btn" (click)="saveEntry()">Save Entry</button>
      </div>
    </div>
  </ng-container>
</div>
