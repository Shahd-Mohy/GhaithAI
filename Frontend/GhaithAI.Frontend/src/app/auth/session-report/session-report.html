<main class="sr-page">
  <header class="sr-topbar">
    <button type="button" class="sr-back" (click)="goBack()">
      <svg viewBox="0 0 24 24">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.42-1.41L7.83 13H20z" />
      </svg>
      Transcript
    </button>
    <div>
      <h1>Clinical Session Report</h1>
      <p>Review the generated report, SOAP edits, evidence, and versions.</p>
    </div>
  </header>

  <app-report-review
    *ngIf="sessionId"
    [sessionId]="sessionId"
    [embedded]="false">
  </app-report-review>
</main>
