<div class="success-page">

  <div class="loading-state" *ngIf="loading">
    <svg fill="none" stroke="#0B8FAC" stroke-width="2" viewBox="0 0 24 24"
         style="animation:spin 1s linear infinite; width:32px; height:32px;">
      <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
    </svg>
    Confirming your payment...
  </div>

  <div class="success-content" *ngIf="!loading">
    <div class="success-icon">
      <svg fill="none" stroke="#059669" stroke-width="2" viewBox="0 0 24 24">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>
    <h1>Payment Successful! 🎉</h1>
    <p>Your booking has been confirmed. You'll receive a confirmation email shortly.</p>
    <div class="actions">
      <button class="btn-primary" (click)="goToDashboard()">
        Go to Dashboard
      </button>
      <a routerLink="/dashboard/professionals" class="btn-outline">
        Book Another Session
      </a>
    </div>
  </div>

</div>
